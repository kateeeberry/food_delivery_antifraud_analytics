version: 0.1
source: Neon, schema food_delivery_raw (synthetic dataset, seed 42), loaded 2026-10-27
business_timezone: Europe/Berlin
base_currency: EUR

definitions:
  fulfilled_order: "status IN ('delivered','completed')"
    # 'completed' = 'delivered' renamed from 2025-08-01; volume continuous (checked monthly)
  test_accounts: "users.email_domain = 'foodapp-test.internal'"
    # excluded from ALL metrics (150 accounts, 1717 orders)
  timestamps: "orders.created_at without 'Z' = Europe/Berlin local time -> convert to UTC"
    # affects 12519 orders, 2025-03-10..2025-03-24 (checked: +1h vs payments)
  duplicate_payment: "if an order has >1 'captured' payment, keep the earliest; later ones = duplicate_failed"
    # 1863 orders affected
  valid_delivery_duration: "delivered_at_utc IS NOT NULL AND is_fulfilled AND delivered_at_utc >= created_at_utc"
    # 231 orders with negative duration (-1..-30 min, no pattern by city/status/month)
    # + 929 fulfilled orders without delivered_at_utc = 1160 (~0.25% of fulfilled)
    # excluded from delivery-time analysis ONLY; kept in order counts and revenue  

  delivery_duration_bins:
    expression: "ROUND(EXTRACT(EPOCH FROM (delivered_at_utc - created_at_utc)) / 60, 2)"
    bins: ["<30", "30-45", "45-60", "60-90", "90-120", "120+"]
    boundaries: "half-open: [lower, upper); 120+ includes exactly 120"
    applies_to: "valid_delivery_duration orders only (463 084)"

  late_delivery_refund:
    definition: "refunds.reason = 'late_delivery'"
    counted_per: "order (DISTINCT order_id, to avoid fan-out)"

  not_delivered_refund:
    definition: "refunds.reason = 'not_delivered'"
    note: "99.7% of refunds in the <30 min bin; used as fraud signal, not as a delivery-delay signal"

  long_delivery_group:
    definition: "duration >= 60 min"
    note: "working threshold chosen from bin distribution, not a business definition; confirm"

    suspicious_courier:
    rule: ">= 10 valid orders AND median delivery duration < 10 min"
    status: "candidate v2; v1 (>= 50) found 24 couriers; courier 1042 (46 orders) added"
    result: "25 couriers, 19,367 orders (4.2% of valid), 201,042 EUR direct not_delivered refunds = 43.3% of all refunds"
    caveat: "indicators, not proof of fraud; lower bound of loss (excludes order value and courier payouts)"

    refund_abuser_user:
    rule: ">= 5 fulfilled orders (non-test) AND >= 30% of them have a refund (any reason)"
    status: "candidate; threshold fixed before scoring"
    evidence: "110 users (of 18,253 with >=5 orders); 740 refunds: not_delivered 52.7%, missing_items 45.7%, other 1.6%; threshold sits in a gap (only 5 users at 30-40%)"
    overlap_with_suspicious_courier: "39 of 390 not_delivered refunds (5.3% of all 740); users are mostly not victims of the courier cluster"
    caveat: "indicator, not proof; reason mix not yet compared with the rest of users"
  
metrics:
  payment_failure_rate:
    numerator: "status_clean IN ('failed','duplicate_failed')"
    denominator: "all rows in food_delivery_clean.payments (incl. voided)"
    note: "sensitivity check: also compute without voided; report both"

  late_delivery_refund_rate:
    numerator: "orders with a late_delivery refund"
    denominator: "valid orders in the group (delivery_duration_bins)"
    result: "<60 min: 0.13% (583 / 448,596); >=60 min: 6.87% (995 / 14,488); chi2 = 18,741.96, p < 0.001; ratio ~52.8"
    caveat: "association, not causation (city, hour, period not controlled)"
  
  direct_refund_loss_eur:
    definition: "SUM(refunds.amount_eur) for orders in food_delivery_clean.orders"
    base: "clean orders (excludes test accounts)"
    total_all_reasons: 464132.98
    suspicious_courier_share: "43.2% (200,590.80 EUR)"
  
  extreme_delivery_durations: "valid durations > 120 min are NOT excluded"
       # 1,155 >120 (0.25%), no clustering by courier; report median/percentiles, not mean

  promo_ring_device:
    rule: ">= 3 non-test accounts on one device_id AND >= 80% of those accounts redeemed WELCOME10"
    status: "candidate; thresholds fixed before scoring"
    evidence: "40 devices / 228 accounts with >=3 accounts; all share 1 card; avg WELCOME10 share = 1.00 vs 0.31 for 500 two-account devices (households)"
    note: "shared card does NOT separate rings from households (378 of 378 paying households share one card); group size and promo usage do"
    caveat: "indicator, not proof; blind to 2-account rings"

open_issues:   # found, no decision yet
  - "fulfilled orders without courier_id (1397) and without delivered_at (931)"
  - "negative total_eur (18 orders)" 
  - "thresholds (60 min, 10 min, 50 orders) are working values; confirm or revise"
  - "late_delivery effect not controlled for city/hour/period (Frankfurt launch, FALL15)"
  - "check refunds.amount_eur against orders.total_eur (refund larger than order?) before using EUR loss figures"
